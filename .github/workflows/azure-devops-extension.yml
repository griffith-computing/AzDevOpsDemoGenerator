name: Build Azure DevOps Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: azure-devops-template-projects-vsix
          path: extension/packages/*.vsix
